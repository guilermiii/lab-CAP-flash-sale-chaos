spring:
  application:
    name: flash-sale-chaos-lab
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:25432}/${DB_NAME:flashsale}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 20
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26379}
      timeout: 2000ms

toxiproxy:
  api-url: ${TOXIPROXY_API_URL:http://localhost:8474}
  postgres-proxy: postgres-proxy
  redis-proxy: redis-proxy

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
